name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check ci-practice

  unit:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r ci-practice/requirements.txt
      - name: Run unit tests
        working-directory: ci-practice
        run: pytest -m "not quarantine" --splits 4 --group ${{ matrix.shard }} -v --junitxml=report-${{ matrix.shard }}.xml
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report-${{ matrix.shard }}
          path: ci-practice/report-${{ matrix.shard }}.xml
          if-no-files-found: ignore

  quarantine:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r ci-practice/requirements.txt
      - name: Run quarantine tests
        working-directory: ci-practice
        run: pytest -m quarantine -v

  docker-tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker build -t ci-practice-tests ./ci-practice
      - name: Run tests in container
        run: docker run --rm ci-practice-tests

  deploy-staging:
    needs: [unit, docker-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Деплой на staging выполнен (имитация)"

